# EnergieLab - diese eine Datei im Portainer Web editor einfügen.
# Vor "Deploy the stack" mindestens HA_URL und HA_TOKEN ersetzen.
services:
  energylab:
    image: ghcr.io/lrdtiberius/energylab:latest
    container_name: energylab
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      TZ: "Europe/Berlin"
      # Home Assistant. Der Long-Lived Access Token bleibt nur lokal im Stack.
      HA_URL: "http://homeassistant.local:8123"
      HA_TOKEN: "BITTE_HA_TOKEN_EINTRAGEN"
      HA_GRID_IMPORT_ENTITY: ""
      HA_PV_SELF_ENTITY: ""
      HA_GAS_ENTITY: ""

      # Zieladresse des Buttons im Bereich Unterstützung.
      BUY_ME_A_COFFEE_URL: ""
    volumes:
      - energylab_data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  energylab_data:
    name: energylab_data
